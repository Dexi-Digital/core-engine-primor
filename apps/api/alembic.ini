[alembic]
script_location = alembic
prepend_sys_path = .
# Em prod, env.py prefere $DATABASE_URL do ambiente. Esta linha so serve
# como fallback pra `alembic revision --autogenerate` rodar localmente
# sem precisar exportar DATABASE_URL antes.
sqlalchemy.url = postgresql+psycopg2://primor:primor@localhost:5432/primor

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
